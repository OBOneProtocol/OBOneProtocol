<line x1="95" y1="130" x2="95" y2="110" stroke="#d0d7de" stroke-width="1.5"/><line class="flow" style="animation-delay:1.2s" x1="95" y1="130" x2="95" y2="110" stroke="#1a7f37" stroke-width="2.5" stroke-linecap="round"/>
<rect class="gate" x="20" y="130" width="150" height="30" rx="15" fill="#dafbe1" stroke="#1a7f37"/><text x="95" y="149" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#1f2328">Approval gate</text>
<text x="470" y="240" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#59636e" style="paint-order:stroke" stroke="#ffffff" stroke-width="6">verified result returns for approval</text>
