<rect x="200" y="50" width="120" height="60" rx="8" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/><text x="260.0" y="76.0" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#1f2328">Personal</text><text x="260.0" y="92.0" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#59636e">agent</text>
