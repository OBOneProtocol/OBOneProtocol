<svg xmlns="http://www.w3.org/2000/svg" width="880" height="260" viewBox="0 0 880 260" role="img" aria-labelledby="t d">
<title id="t">How the agent system is organized</title><desc id="d">A human approves the work. A personal agent briefs a lead orchestrator, which assigns four specialists: build and test, security review, reproduction, and product and content. A verified result passes an approval gate and returns to the human.</desc>
<style>
.flow{stroke-dasharray:6 54;animation:flow 2.4s linear infinite}
@keyframes flow{from{stroke-dashoffset:60}to{stroke-dashoffset:0}}
.ret{stroke-dasharray:6 54;animation:flow 2.4s linear infinite reverse}
.gate{animation:glow 3s ease-in-out infinite}
@keyframes glow{0%,100%{stroke-opacity:.5;stroke-width:1.5}50%{stroke-opacity:1;stroke-width:3}}
@media (prefers-reduced-motion:reduce){.flow,.ret,.gate{animation:none}}
</style>
<rect x=".5" y=".5" width="879" height="259" rx="14" fill="#ffffff" stroke="#d0d7de"/>
