<line x1="320" y1="80" x2="350" y2="80" stroke="#d0d7de" stroke-width="1.5"/><line class="flow" style="animation-delay:0.3s" x1="320" y1="80" x2="350" y2="80" stroke="#0969da" stroke-width="2.5" stroke-linecap="round"/>
<line x1="480" y1="80" x2="640" y2="48" stroke="#d0d7de" stroke-width="1.5"/><line class="flow" style="animation-delay:0.6s" x1="480" y1="80" x2="640" y2="48" stroke="#0969da" stroke-width="2.5" stroke-linecap="round"/>
<line x1="480" y1="80" x2="640" y2="104" stroke="#d0d7de" stroke-width="1.5"/><line class="flow" style="animation-delay:0.75s" x1="480" y1="80" x2="640" y2="104" stroke="#0969da" stroke-width="2.5" stroke-linecap="round"/>
<line x1="480" y1="80" x2="640" y2="160" stroke="#d0d7de" stroke-width="1.5"/><line class="flow" style="animation-delay:0.8999999999999999s" x1="480" y1="80" x2="640" y2="160" stroke="#0969da" stroke-width="2.5" stroke-linecap="round"/>
<line x1="480" y1="80" x2="640" y2="216" stroke="#d0d7de" stroke-width="1.5"/><line class="flow" style="animation-delay:1.0499999999999998s" x1="480" y1="80" x2="640" y2="216" stroke="#0969da" stroke-width="2.5" stroke-linecap="round"/>
