<svg xmlns="http://www.w3.org/2000/svg" width="880" height="260" viewBox="0 0 880 260" role="img" aria-labelledby="t d">
<title id="t">How the agent system is organized</title><desc id="d">A human in the lead briefs a personal agent, which briefs a lead orchestrator. The orchestrator assigns four specialists: build and test, security review, reproduction, and product and content. Results return through the orchestrator to the personal agent, which presents them to the human at an approval gate. Approved work goes back to the specialists, who finish it.</desc>
