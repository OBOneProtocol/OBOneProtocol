name: Contribution snake and impact card

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: snake
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3.5.0
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Add month labels, legend and a hold before the snake starts
        env:
          GH_TOKEN: ${{ github.token }}
          LOGIN: ${{ github.repository_owner }}
        run: |
          gh api graphql -f login="$LOGIN" -f query='query($login:String!){user(login:$login){contributionsCollection{contributionCalendar{totalContributions weeks{firstDay}}}}}' > calendar.json
          python3 scripts/snake_frame.py calendar.json \
            dist/github-contribution-grid-snake.svg light \
            dist/github-contribution-grid-snake-dark.svg dark

      - name: Rebuild the impact card from live PR counts
        env:
          GH_TOKEN: ${{ github.token }}
          LOGIN: ${{ github.repository_owner }}
        run: |
          python3 scripts/impact_card.py "$LOGIN" \
            assets/impact-light.svg dist/impact-light.svg \
            assets/impact-dark.svg dist/impact-dark.svg

      - name: Publish to the output branch
        env:
          REPO: ${{ github.repository }}
          TOKEN: ${{ github.token }}
        run: |
          cd dist
          git init -q -b output
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -q -m "Update contribution snake and impact card"
          git push -f "https://x-access-token:${TOKEN}@github.com/${REPO}.git" output
